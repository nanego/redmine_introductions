# This file is used by the icons rake task to download SVG icons from Tabler
# and build the plugin sprite:
#
#   bundle exec rake icons:plugin:generate NAME=redmine_introductions
#
# Keys description:
#   - name: destination icon name
#     svg: source icon name from the Tabler repository
#     style: outline (default) or filled

- name: presentation
  svg: presentation
